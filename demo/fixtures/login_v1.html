<!doctype html>
<html>
<head><meta charset="utf-8"><title>Login - v1</title></head>
<body>
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" class="input" placeholder="Enter username" />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" class="input" placeholder="Enter password" />

    <button id="login-btn" type="submit" class="btn btn-primary">Log In</button>
  </form>
</body>
</html>
