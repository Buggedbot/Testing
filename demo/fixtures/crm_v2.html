<!doctype html>
<html>
<head><meta charset="utf-8"><title>CRM Contact - v2 (redesigned)</title></head>
<body>
  <!-- Redesign: shadow DOM ids/classes regenerated by a new component
       library. "Cancel" was also relabeled "Discard Changes" -- this is the
       case the risk deny-list must catch and refuse to auto-heal onto. -->
  <div id="contact-card-host"></div>
  <script>
    const host = document.getElementById("contact-card-host");
    const shadow = host.attachShadow({ mode: "open" });
    shadow.innerHTML = `
      <div class="lwc-card-7f2">
        <h2>Jane Doe</h2>
        <button id="act-5510" type="button" class="lwc-button primary-action-9c3">Save</button>
        <button id="act-5511" type="button" class="lwc-button secondary-action-1a4">Discard Changes</button>
      </div>
    `;
  </script>

  <iframe id="notes-frame-2" title="Notes" src="crm_notes_v2.html"></iframe>
</body>
</html>
