[project]
name = "self-healing-locator"
version = "0.1.0"
description = "A self-healing locator agent for Playwright: detects broken UI test locators and heals them via DOM-similarity heuristics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Only needed for the opt-in llm_backend="anthropic" GenAI fallback tier.
# The default llm_backend="copilot_cli" needs no extra pip package -- it
# shells out to the `gh` CLI, which must be separately installed/authenticated.
llm = [
    "anthropic>=0.68.0",
]

[project.scripts]
shl = "self_healing_locator.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["self_healing_locator*"]
